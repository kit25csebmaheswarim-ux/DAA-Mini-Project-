{% extends "base.html" %}

{% block title %}Add Resource - Admin{% endblock %}

{% block content %}

<div class="page-header">
    <div class="header-with-back">
        <a href="{{ url_for('admin') }}" class="btn btn-secondary btn-sm">← Back to Admin</a>
        <h1 class="page-title">➕ Add New Resource</h1>
    </div>
</div>

{% if errors %}
<div class="error-list">
    <strong>❌ Please fix the following errors:</strong>
    <ul>
        {% for error in errors %}
        <li>{{ error }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}

<div class="form-container">
    <form method="POST" action="{{ url_for('add_resource') }}">

        <div class="form-group">
            <label for="name">📦 Resource Name <span class="required">*</span></label>
            <input type="text" id="name" name="name" class="form-control"
                   placeholder="e.g., Computer Lab 3"
                   value="{{ form_data.get('name', '') }}" required>
        </div>

        <div class="form-group">
            <label for="category">📂 Category <span class="required">*</span></label>
            <select id="category" name="category" class="form-control" required>
                <option value="">-- Select Category --</option>
                {% set cats = ['Computer Lab', 'Projector', 'Laptop', 'Seminar Hall', 'Classroom', 'Printer', 'Other'] %}
                {% for cat in cats %}
                <option value="{{ cat }}" {% if form_data.get('category') == cat %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="location">📍 Location <span class="required">*</span></label>
            <input type="text" id="location" name="location" class="form-control"
                   placeholder="e.g., Block A, Room 101"
                   value="{{ form_data.get('location', '') }}" required>
        </div>

        <div class="form-group">
            <label for="capacity">👥 Capacity (optional)</label>
            <input type="number" id="capacity" name="capacity" class="form-control"
                   placeholder="e.g., 30" min="1"
                   value="{{ form_data.get('capacity', '') }}">
        </div>

        <div class="form-group">
            <label for="description">📋 Description (optional)</label>
            <textarea id="description" name="description" class="form-control" rows="3"
                      placeholder="Brief description of the resource...">{{ form_data.get('description', '') }}</textarea>
        </div>

        <div class="form-group">
            <label for="status">📌 Status</label>
            <select id="status" name="status" class="form-control">
                <option value="Available"   {% if form_data.get('status','Available') == 'Available'   %}selected{% endif %}>Available</option>
                <option value="Allocated"   {% if form_data.get('status') == 'Allocated'   %}selected{% endif %}>Allocated</option>
                <option value="Maintenance" {% if form_data.get('status') == 'Maintenance' %}selected{% endif %}>Maintenance</option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">➕ Add Resource</button>
            <a href="{{ url_for('admin') }}" class="btn btn-secondary">✖ Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
